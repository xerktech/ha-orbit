name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -q

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validate
        uses: hacs/action@main
        with:
          category: integration
          # brands: a brand-new domain isn't in home-assistant/brands yet.
          # license: HACS reads the license from GitHub's repo metadata, which
          #   is derived from the DEFAULT branch. On a PR whose LICENSE isn't on
          #   main yet this is a false negative; it passes once merged.
          ignore: brands license
